# Component deploy workflow, called by the application's deployer workflow.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: deploy

on:
  workflow_call:
    inputs:
      artifact-id:
        type: string
        required: true
      environment:
        type: string
        required: true

jobs:
  deploy:
    steps:
      - name: Deploy hivemart-web (simulated)
        uses: docker://alpine:3.20
        run: |
          echo "=== hivemart-web deployment ==="
          echo "Artifact ID : ${{ inputs.artifact-id }}"
          echo "Environment : ${{ inputs.environment }}"
          echo "Simulating rollout..."
          sleep 5
          echo "hivemart-web deployed to ${{ inputs.environment }}."
